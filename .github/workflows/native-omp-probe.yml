name: native OMP probe (dispatch only)

# P2-B.6 ④ evidence: how OMP installs on each platform and whether the observer
# can spawn it with no command shell. Dispatch-only on purpose — it installs OMP
# from the public registry and never touches the live stack, the outbox, or the
# bridge. Windows is the target; macOS runs the same probe as a control so a
# difference is attributable to the platform rather than to the script.
on:
  workflow_dispatch:
  # The dispatch API only sees workflows on the default branch, so this one also
  # triggers from the branch that carries it, and only when the probe itself
  # changes — never on unrelated pushes.
  push:
    paths:
      - .github/workflows/native-omp-probe.yml
      - scripts/omp-native-probe.mjs

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The official installers put bun exactly where OMP's shim looks for it
      # (~/.bun/bin/bun.exe); npm's global package does not, and the shim then
      # fails with "bun is not installed in %PATH%".
      - name: Install bun
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell.exe -NoProfile -Command "irm bun.sh/install.ps1 | iex"
          else
            curl -fsSL https://bun.sh/install | bash
          fi
      - name: Install OMP
        shell: bash
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun add -g @oh-my-pi/pi-coding-agent
          omp --version
      - name: Probe native OMP shape and spawn
        run: node scripts/omp-native-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omp-native-probe-${{ matrix.os }}
          path: artifacts/omp-native-probe-*.json
