name: Mac package readiness
on:
  workflow_dispatch:
jobs:
  build-and-synthetic-tests:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.versions.node})'
      - run: npm ci --no-audit --no-fund
      - run: npm run setup
      - run: npm run build
      - run: npm run lint
      - run: npm test && npm run test:integration
      - run: npx playwright install chromium
      - run: npm run test:connection-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-synthetic-evidence
          path: artifacts/
